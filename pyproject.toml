[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-arithmetic-clip"
version = "0.1.0"
description = "Classification experiments with Hugging Face CLIP and task arithmetic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.49.0",
    "numpy==1.26.4",
    "scipy==1.15.2",
    "Pillow==11.1.0",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
ta-clip = "task_arithmetic_clip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

